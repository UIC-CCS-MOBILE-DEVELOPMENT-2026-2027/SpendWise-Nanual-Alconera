name: spendwise
description: "A gamified expense tracking application."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Retain the tested Android implementation floor (includes release-startup fixes).
# Re-evaluate only alongside Android release smoke tests.
dependency_overrides:
  shared_preferences_android: ^2.5.3

flutter:
  uses-material-design: true
